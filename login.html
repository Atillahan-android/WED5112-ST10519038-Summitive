<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Turk Boutique Hotel | Amazing Accommodation in Durban</title>
    <link rel="stylesheet" href="css/home_page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-brand">
            <h1>Login</h1>
            <img src="Images/Logo of business.jpg" alt="The hotel logo" style="height: 100px; width: 500px;"> <!-- image about the hotel logo -->
        </div>
        <div class="dropdown">
            <button class="dropbtn">Dropdown V</button>
            <div class="dropdown-content">
                <a href="Home_page.html">Home Page</a>
                <a href="Contact_us.html">Contact Us</a>
                <a href="booking.html">Book Now</a>
                <a href="gallery_page.html">Gallery</a>
            </div>
        </div>
    </header>

    <main>
        <section class="auth-card">
            <h2>Welcome back</h2>
            <p>Sign in to manage your stay and access your account.</p>

            <form class="auth-form" id="loginForm">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>

                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>

                <button type="submit" id="loginBtn" class="nav-button">Login</button>
            </form>

            <p class="auth-link">Need an account? <a href="signup.html">Sign up here</a></p>
        </section>

        <button class="nav-button" type="button" onclick="location.href='Home_page.html'">Home Page</button>
    </main>
    <script src="javascript/javascript.js"></script>
</body>
</html>
