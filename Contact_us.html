<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact The Turk Boutique Hotel | Amazing Accommodation in Durban</title>
    <link rel="stylesheet" href="css/Contact_us.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Contact The Turk Boutique Hotel</h1>
    </header>

    <main>
        <div class="contact-layout">
            <section class="info-card">
                <h2>Get in touch</h2>
                <p>Please feel free to contact us with any questions or concerns.</p>
                <p><strong>Phone:</strong> (123) 456-7890</p>
                <p><strong>Email:</strong> info@theturkboutiquehotel.com</p>
                <p><strong>Location:</strong> Durban, South Africa</p>
            </section>

            <section class="contact-form">
                <h2>Contact Form</h2>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <input type="submit" value="Send Message">
            </section>
        </div>

        <button class="nav-button" type="button" onclick="location.href='Home_page.html'">home page</button>
    </main>
    <div class="map-wrapper">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3458.473356118987!2d31.019415976410905!3d-29.90827192497664!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ef7a93b35563bfd%3A0x2cccefedfd67009c!2s110%20Lighthouse%20Rd%2C%20Ocean%20View%2C%20Bluff%2C%204052!5e0!3m2!1sen!2sza!4v1794252386208!5m2!1sen!2sza"
            allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <footer>
        <p>&copy; 2024 The Turk Boutique Hotel. All rights reserved.</p>
    </footer>
    <script src="javascript/javascript.js"></script>
</body>

</html>
