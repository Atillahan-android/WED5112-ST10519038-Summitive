<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | The Turk Boutique Hotel | Amazing Accommodation in Durban</title>
    <link rel="stylesheet" href="css/home_page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-brand">
            <h1>Sign Up</h1>
            <img src="Images/Logo of business.jpg" alt="The hotel logo" style="height: 100px; width: 500px;"> <!-- image about the hotel logo -->
        </div>
        <div class="dropdown">
            <button class="dropbtn">Dropdown V</button>
            <div class="dropdown-content">
                <a href="Home_page.html">Home Page</a>
                <a href="Contact_us.html">Contact Us</a>
                <a href="booking.html">Book Now</a>
                <a href="gallery_page.html">Gallery</a>
            </div>
        </div>
    </header>

    <main>
        <section class="auth-card">
            <h2>Create your account</h2>
            <p>Join The Turk Boutique Hotel and start planning your perfect stay.</p>

            <form class="auth-form" id="signupForm">
                <label for="signup-name">Full Name:</label>
                <input type="text" id="signup-name" name="fullname" required>

                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="email" required>

                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="password" required>

                <label for="signup-confirm">Confirm Password:</label>
                <input type="password" id="signup-confirm" name="confirm-password" required>

                <button type="submit" id="signupBtn" class="nav-button">Sign Up</button>
            </form>

            <p class="auth-link">Already have an account? <a href="login.html">Log in here</a></p>
        </section>

        <button class="nav-button" type="button" onclick="location.href='Home_page.html'">Home Page</button>
    </main>
    <script src="javascript/javascript.js"></script>
</body>
</html>
